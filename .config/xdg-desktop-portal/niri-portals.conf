# 临时绕过：niri 26.04 的 ServiceChannel 只认 type 1，gnome 后端的文件选择器（Nautilus）
# 建 X11 父窗口时崩溃，X11 应用的「另存为」没反应；gtk 后端自己弹窗，绕开它。
# 三行抄自 niri-portals.conf，不能省（没有 gnome-shell，通知会失效；录屏仍走 gnome）。
# 等 niri 带 d054395225 后删掉 FileChooser 这行验证，详见 docs/xdg-desktop-portal.md。
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
org.freedesktop.impl.portal.FileChooser=gtk;
